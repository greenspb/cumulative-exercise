# Pre-commit hooks configuration for Python projects
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML files
      - id: check-json
        name: Check JSON files
      - id: check-toml
        name: Check TOML files
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-case-conflict
        name: Check for case conflicts
      - id: check-docstring-first
        name: Check docstring is first
      - id: debug-statements
        name: Check for debug statements
      - id: mixed-line-ending
        name: Check for mixed line endings
        args: ['--fix=lf']

  # Python code formatting with Black
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        name: Format code with Black
        language_version: python3

  # Python import sorting with isort
  - repo: https://github.com/pycqa/isort
    rev: 9.0.0b5
    hooks:
      - id: isort
        name: Sort imports with isort
        args: ["--profile", "black"]

  - repo: local
    hooks:
    - id: pylint
      name: pylint
      entry: pylint
      language: system
      types: [python]
      args:
        [
          "--rcfile=web_app/.pylintrc", "web_app/"
        ]


  # Python type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        name: Type check with mypy
        args: [--config-file=web_app/mypy.ini]
        files: ^web_app/
        additional_dependencies: [types-requests, fastapi]

  # Python testing with pytest
  - repo: local
    hooks:
      - id: pytest-check
        name: Run pytest on changed files
        entry: pytest
        language: system
        pass_filenames: false
        always_run: false
        stages: [pre-commit]
        types: [python]
        verbose: true
        args: [-c, web_app/pytest.ini]
